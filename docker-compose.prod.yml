# Production stack. Secrets come from /opt/troyka/.env on the server (never committed):
#   POSTGRES_PASSWORD=...   DOMAIN=brokerkillers.uz
#   SUPERADMIN_EMAIL=...    SUPERADMIN_PASSWORD=...  (password only used when that account is first created)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: troyka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: troyka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U troyka']
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://troyka:${POSTGRES_PASSWORD}@postgres:5432/troyka
      INSTRUMENT: frxXAUUSD
      PORT: 4000
      FRONTEND_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_BACKEND_HTTP_URL: https://${DOMAIN}
        VITE_BACKEND_WS_URL: wss://${DOMAIN}/ws
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

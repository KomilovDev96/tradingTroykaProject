server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed build assets never change — cache them hard; index.html must always be fresh.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: every client-side route (/trades, /analytics, ...) serves index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
